<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Spot Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="#" class="navbar-brand">Surf Spot Explorer</a>
        <div class="navbar-nav">
            <button id="surf-locations-btn" class="button">Surf Locations</button>
            <button id="sign-in" class="button">Sign In</button>
            <button id="sign-out" class="button" style="display: none;">Sign Out</button>
        </div>
    </nav>

    <div id="user-display" class="user-display"></div>

    <div id="main-content" class="main-content"></div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">&times;</button>
            
            <div id="login-form">
                <h2>Sign In</h2>
                <form>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="button" id="login-btn" class="button">Sign In</button>
                </form>
                <p>Don't have an account? <button id="create-account-btn" class="button">Create Account</button></p>
            </div>

            <div id="create-account-form" style="display: none;">
                <h2>Create Account</h2>
                <form>
                    <div class="form-group">
                        <label for="new-username">Username</label>
                        <input type="text" id="new-username" required>
                    </div>
                    <div class="form-group">
                        <label for="new-email">Email</label>
                        <input type="email" id="new-email" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Password</label>
                        <input type="password" id="new-password" required>
                    </div>
                    <button type="button" id="create-btn" class="button">Create Account</button>
                </form>
                <p>Already have an account? <button id="back-to-login-btn" class="button">Back to Sign In</button></p>
            </div>
        </div>
    </div>

    <script src="Cody_Maverick.js"></script>
</body>
</html>
